set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -g focus-events on
setw -g mode-keys vi

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Disable ESC as Meta prefix
set -s escape-time 0

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off
set-window-option -g automatic-rename off

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf # <C-a> r

# ===== TokyoNight Night =====

# Active pane border (Night blue)
set -g pane-active-border-style 'fg=#7aa2f7'
set -g pane-border-style 'fg=#24283b'

# Status bar base (darker background)
set -g status-style "bg=#1a1b26 fg=#c0caf5"

# Left (minimal)
set -g status-left ""

# Right (empty, clean)
set -g status-right ""

# Window inactive
setw -g window-status-format "#[bg=#1a1b26,fg=#565f89] #I:#W#[fg=#e0af68]#F"

# Window active
setw -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26,bold] #I:#W #[default]"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
